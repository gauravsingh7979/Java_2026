# ===================================================================
# FindIt - Smart Lost & Found Platform
# Application Configuration
# ===================================================================

server.port=8080
spring.application.name=findit-backend

# -------------------------------------------------------------------
# Database Connection (MySQL 8)
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/findit_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Aadimal@0620}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=3
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# JWT Security Configuration
# -------------------------------------------------------------------
# 256-bit secret key for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:findItSuperSecretSecureKeyForJwtTokenGeneration2026EnterpriseLostAndFoundPlatform!}
# Token validity: 86400000 ms = 24 hours
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# File Upload & Storage Configuration
# -------------------------------------------------------------------
app.upload.dir=${UPLOAD_DIR:uploads/images}
app.upload.max-file-size=${MAX_FILE_SIZE:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# -------------------------------------------------------------------
# OpenAPI / Swagger
# -------------------------------------------------------------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# -------------------------------------------------------------------
# Spring Mail (Optional / Graceful Fallback)
# -------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:findit.notifications@gmail.com}
spring.mail.password=${MAIL_PASSWORD:dummy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# -------------------------------------------------------------------
# Logging
# -------------------------------------------------------------------
logging.level.com.findit=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN
