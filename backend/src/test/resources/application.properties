# Test Configuration - H2 in-memory DB
server.port=0
spring.datasource.url=jdbc:h2:mem:findit_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=findItSuperSecretSecureKeyForJwtTokenGeneration2026EnterpriseLostAndFoundPlatform!
app.jwt.expiration-ms=86400000
app.upload.dir=target/test-uploads
app.upload.max-file-size=5242880
app.cors.allowed-origins=http://localhost:5173
